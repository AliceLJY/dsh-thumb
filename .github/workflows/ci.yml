name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check src/index.js
      - run: node --check src/client.js
      - run: node --check test/smoke.mjs
      - run: node --check test/measure-widths.mjs
